<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘 저녁 뭐 먹지 화면 시안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  /* 레이아웃: 왼쪽 안내 패널 + 오른쪽 휴대폰 프레임. 좁은 화면에서는 휴대폰 → 패널 순서로 쌓임 */
  --page-bg:#F2F0ED; --panel:#FFFFFF; --ink:#1E2125; --muted:#62666D; --line:#E2DED8; --accent:#E8571F;
  --font-body:"Pretendard","Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page-bg:#131313; --panel:#1B1B1B; --ink:#ECECEC; --muted:#A0A3A8; --line:#2F2F2F; --accent:#FF8A5C; color-scheme:dark; }
}
:root[data-theme="dark"]{ --page-bg:#131313; --panel:#1B1B1B; --ink:#ECECEC; --muted:#A0A3A8; --line:#2F2F2F; --accent:#FF8A5C; color-scheme:dark; }

/* ── 앱 토큰 (UI_PLAN.md 2장) ── */
.phone{
  --bg:#FFFFFF; --surface:#F8F9FA; --surface-2:#EEF0F2; --text:#212529; --text-2:#6C757D; --line:#E9ECEF;
  --primary:#FF6B35; --primary-strong:#E0581F; --on-primary:#FFFFFF; --primary-soft:#FFF0EA; --error:#E03131;
  --map-bg:#EEF1EC; --map-road:#FFFFFF; --map-park:#D5EACF; --map-water:#CDE2F3; --me:#1C7ED6;
  --k:#F08C00; --c:#E03131; --j:#1C7ED6; --w:#2B8A3E; --e:#868E96;
  --shadow:0 6px 20px rgba(0,0,0,.08); color-scheme:light;
}
.phone[data-mode="dark"], :root[data-theme="dark"] .phone[data-mode="system"]{
  --bg:#121212; --surface:#1E1E1E; --surface-2:#2A2A2A; --text:#F1F3F5; --text-2:#ADB5BD; --line:#2C2C2C;
  --primary:#FF8A5C; --primary-strong:#FF8A5C; --on-primary:#1A0F0A; --primary-soft:#3A2219; --error:#FF6B6B;
  --map-bg:#1B1F23; --map-road:#2C3238; --map-park:#1D3222; --map-water:#182B3C; --me:#4DABF7;
  --k:#FFA94D; --c:#FF6B6B; --j:#4DABF7; --w:#51CF66; --e:#ADB5BD;
  --shadow:0 6px 20px rgba(0,0,0,.45); color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .phone[data-mode="system"]{
    --bg:#121212; --surface:#1E1E1E; --surface-2:#2A2A2A; --text:#F1F3F5; --text-2:#ADB5BD; --line:#2C2C2C;
    --primary:#FF8A5C; --primary-strong:#FF8A5C; --on-primary:#1A0F0A; --primary-soft:#3A2219; --error:#FF6B6B;
    --map-bg:#1B1F23; --map-road:#2C3238; --map-park:#1D3222; --map-water:#182B3C; --me:#4DABF7;
    --k:#FFA94D; --c:#FF6B6B; --j:#4DABF7; --w:#51CF66; --e:#ADB5BD;
    --shadow:0 6px 20px rgba(0,0,0,.45); color-scheme:dark;
  }
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page-bg); color:var(--ink); font-family:var(--font-body); line-height:1.5; -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.page{display:grid; grid-template-columns:minmax(270px,330px) auto; gap:40px; justify-content:center; align-items:start; padding:32px 24px 48px}
@media (max-width:860px){ .page{grid-template-columns:minmax(0,1fr); padding:16px; gap:24px} .panel{order:2; position:static!important} .stage{order:1} }

/* ── 안내 패널 ── */
.panel{background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:22px; display:flex; flex-direction:column; gap:22px; position:sticky; top:24px}
.panel h1{font-size:21px; font-weight:800; margin:0; text-wrap:balance; letter-spacing:-.01em}
.panel .sub{margin:4px 0 0; color:var(--muted); font-size:13px}
.panel h2{font-size:12px; font-weight:700; color:var(--muted); margin:0 0 8px; letter-spacing:.04em}
.scr-list{display:grid; grid-template-columns:1fr 1fr; gap:6px}
.scr{display:flex; flex-direction:column; align-items:flex-start; gap:1px; text-align:left; padding:7px 10px; border-radius:10px; border:1px solid var(--line); background:transparent; font-size:13px; font-weight:500}
.scr .id{font-family:var(--font-mono); font-size:11px; color:var(--muted)}
.scr[aria-current="page"]{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 10%, transparent)}
.scr[aria-current="page"] .id{color:var(--accent)}
.note-box{border-left:3px solid var(--accent); padding:2px 0 2px 12px; font-size:13.5px; line-height:1.65}
.note-box b{display:block; font-size:14px; margin-bottom:2px}
.seg{display:flex; flex-wrap:wrap; gap:6px}
.seg button{border:1px solid var(--line); background:transparent; border-radius:999px; padding:6px 11px; font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--panel); border-color:var(--ink)}
.small{font-size:12.5px; color:var(--muted); line-height:1.6; margin:0}
.reset{align-self:flex-start; border:1px solid var(--line); background:transparent; border-radius:10px; padding:7px 12px; font-size:13px}

/* ── 휴대폰 프레임 ── */
.stage{display:flex; justify-content:center; min-width:0}
.phone{width:390px; height:844px; border-radius:48px; border:11px solid #0E0F10; background:var(--bg); color:var(--text); position:relative; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 30px 70px rgba(0,0,0,.20)}
@media (max-width:440px){ .phone{width:100%; height:760px; border-width:6px; border-radius:30px} }
.status{height:42px; flex:none; display:flex; justify-content:space-between; align-items:center; padding:4px 28px 0; font-size:14px; font-weight:700; font-variant-numeric:tabular-nums}
.status .r{font-size:12px; font-weight:600; letter-spacing:.02em}
.screen{flex:1; overflow-y:auto; overflow-x:hidden; position:relative; scrollbar-width:thin}
.screen.full{display:flex; flex-direction:column; overflow:hidden}
.tabs{flex:none; display:grid; grid-template-columns:repeat(4,1fr); border-top:1px solid var(--line); background:var(--bg); padding:6px 0 14px}
.tabs[hidden]{display:none}
.tab{display:flex; flex-direction:column; align-items:center; gap:2px; border:0; background:none; color:var(--text-2); font-size:11.5px; font-weight:500; padding:4px 0}
.tab svg{width:24px; height:24px}
.tab[aria-current="page"]{color:var(--text); font-weight:700}
.tab.hot{color:var(--primary)}
.tab.hot[aria-current="page"]{color:var(--primary)}

/* ── 앱 공통 ── */
.top{display:flex; align-items:center; gap:6px; padding:6px 10px 6px 16px; min-height:52px; position:sticky; top:0; background:var(--bg); z-index:6}
.top.sub{padding-left:6px}
.h-title{font-size:20px; font-weight:700; margin:0; flex:1; letter-spacing:-.01em}
.ib{width:44px; height:44px; border-radius:12px; border:0; background:transparent; display:grid; place-items:center; color:var(--text); font-size:18px}
.ib svg{width:22px; height:22px}
.ib:hover{background:var(--surface)}
.loc{display:flex; align-items:center; gap:4px; border:0; background:none; font-size:18px; font-weight:700; padding:8px 4px; flex:1; text-align:left}
.loc small{font-size:12px; color:var(--text-2)}
.wline{padding:0 16px 8px; font-size:13.5px; color:var(--text-2)}
.chips{display:flex; gap:8px; overflow-x:auto; padding:4px 16px 10px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap; overflow:visible}
.chip{flex:none; border:1px solid var(--line); background:var(--bg); border-radius:999px; padding:7px 13px; font-size:14px; font-weight:500; white-space:nowrap; color:var(--text); min-height:36px}
.chip .cnt{color:var(--text-2); font-variant-numeric:tabular-nums; margin-left:2px}
.chip[aria-pressed="true"]{background:var(--cc,var(--text)); color:#fff; border-color:transparent}
.chip.all[aria-pressed="true"]{background:var(--text); color:var(--bg)}
.chip[aria-pressed="true"] .cnt{color:inherit; opacity:.85}
.tools{display:flex; justify-content:space-between; align-items:center; padding:0 16px 8px; font-size:13px; color:var(--text-2); gap:8px}
.tools select{border:0; background:none; color:var(--text); font-weight:600; padding:4px 0}
.tools label{display:flex; align-items:center; gap:6px}
.ci{flex:none; width:42px; height:42px; border-radius:13px; display:grid; place-items:center; background:color-mix(in srgb, var(--cc) 16%, transparent); font-size:21px}
.ci.sm{width:30px; height:30px; border-radius:9px; font-size:15px}
.ci.lg{width:52px; height:52px; border-radius:16px; font-size:26px}

.swipe{position:relative; border-bottom:1px solid var(--line); overflow:hidden}
.swipe-act{position:absolute; top:0; right:0; bottom:0; width:88px; border:0; background:var(--error); color:#fff; font-weight:700; font-size:14px}
.swipe-body{position:relative; display:flex; align-items:flex-start; gap:12px; padding:14px 16px; background:var(--bg); cursor:pointer; touch-action:pan-y; transition:transform .2s ease; user-select:none}
.swipe.open .swipe-body{transform:translateX(-88px)}
.swipe-body:hover{background:var(--surface)}
.rb{flex:1; min-width:0}
.rn{font-size:16px; font-weight:700; line-height:1.35}
.rs{font-size:13px; color:var(--text-2); display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:1px}
.ra{font-size:12.5px; color:var(--text-2); margin-top:2px}
.rd{font-size:14px; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; padding-top:2px}
.badge{display:inline-flex; align-items:center; gap:2px; font-size:11.5px; font-weight:600; padding:1px 7px; border-radius:999px; background:var(--surface-2); color:var(--text)}
.hint{padding:6px 16px 0; font-size:12px; color:var(--text-2)}

.skel{display:flex; gap:12px; padding:16px; border-bottom:1px solid var(--line)}
.skel i{display:block; background:var(--surface-2); border-radius:8px; animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.55} to{opacity:1}}

.fab-wrap{position:sticky; bottom:14px; display:flex; justify-content:center; pointer-events:none; padding-top:20px; z-index:4}
.fab{pointer-events:auto; display:flex; align-items:center; gap:8px; border:0; border-radius:999px; padding:0 24px; height:54px; background:var(--primary-strong); color:var(--on-primary); font-size:17px; font-weight:800; box-shadow:0 8px 24px color-mix(in srgb, var(--primary) 45%, transparent)}

.btn{display:flex; align-items:center; justify-content:center; gap:6px; height:52px; border-radius:14px; font-weight:700; font-size:16px; border:1px solid transparent; width:100%; padding:0 14px}
.btn-primary{background:var(--primary-strong); color:var(--on-primary); font-size:17px}
.btn-ghost{background:var(--surface); color:var(--text); border-color:var(--line)}
.btn-sm{height:44px; font-size:15px; border-radius:12px}
.bottom-bar{position:sticky; bottom:0; padding:14px 16px 16px; background:linear-gradient(to bottom, transparent, var(--bg) 26%); z-index:4}
.link{border:0; background:none; color:var(--text-2); font-size:14px; padding:10px 0; text-decoration:underline; text-underline-offset:3px}

.empty{padding:48px 24px; text-align:center; color:var(--text-2); display:flex; flex-direction:column; align-items:center; gap:12px}
.empty .big{font-size:40px}
.empty p{margin:0; font-size:15px; color:var(--text)}

/* 지도 */
.map-wrap{flex:1; position:relative; background:var(--map-bg); min-height:0}
.map-wrap > svg{position:absolute; inset:0; width:100%; height:100%}
.mk{cursor:pointer}
.mk.faded{opacity:.38}
.mk:focus{outline:none}
.mk:focus-visible circle{stroke:var(--primary); stroke-width:4}
.map-credit{position:absolute; right:10px; bottom:10px; font-size:10.5px; font-weight:700; color:var(--text-2); background:color-mix(in srgb, var(--bg) 80%, transparent); padding:2px 6px; border-radius:6px}
.map-me{position:absolute; right:12px; top:12px; width:44px; height:44px; border-radius:12px; border:1px solid var(--line); background:var(--bg); display:grid; place-items:center; box-shadow:var(--shadow)}
.map-card{position:absolute; left:12px; right:12px; bottom:12px; background:var(--bg); border-radius:18px; padding:14px; box-shadow:var(--shadow); border:1px solid var(--line); display:flex; flex-direction:column; gap:12px}
.map-card .row{display:flex; gap:10px; align-items:center}
.map-card .nav{display:flex; gap:4px}
.map-tip{position:absolute; left:50%; bottom:16px; transform:translateX(-50%); background:var(--bg); padding:8px 14px; border-radius:999px; font-size:13px; box-shadow:var(--shadow); white-space:nowrap}
.two{display:grid; grid-template-columns:1fr 1fr; gap:8px}

/* 상세 */
.mini-map{height:180px; position:relative; background:var(--map-bg)}
.mini-map svg{width:100%; height:100%; display:block}
.dt{padding:16px; display:flex; flex-direction:column; gap:12px}
.dt h2{font-size:24px; font-weight:800; margin:0; letter-spacing:-.01em; text-wrap:balance}
.meta{display:flex; flex-direction:column; gap:8px; font-size:15px}
.meta a, .meta button.plain{color:var(--text); text-decoration:none; border:0; background:none; padding:0; text-align:left}
.sec{border-top:8px solid var(--surface); padding:16px}
.sec h3{font-size:16px; margin:0 0 10px; font-weight:700}
.visit{display:flex; justify-content:space-between; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px}
.visit:last-child{border-bottom:0}
.stars{color:var(--k); letter-spacing:1px; white-space:nowrap}
.muted{color:var(--text-2)}

/* 추천 */
.rec-ctx{margin:4px 16px 0; padding:14px; border-radius:16px; background:var(--surface); display:flex; flex-direction:column; gap:8px; font-size:14px}
.rec-ctx .k{color:var(--text-2); font-size:12.5px; font-weight:600}
.rec-hero{display:flex; flex-direction:column; align-items:center; gap:18px; padding:44px 16px 24px; text-align:center}
.rec-hero .spark{font-size:56px; line-height:1}
.rec-hero p{margin:0; color:var(--text-2); font-size:14px}
.go-btn{height:60px; padding:0 30px; border-radius:999px; border:0; background:var(--primary-strong); color:var(--on-primary); font-size:18px; font-weight:800; box-shadow:0 8px 24px color-mix(in srgb, var(--primary) 40%, transparent)}
.lock{display:flex; align-items:center; gap:8px; font-size:14px; color:var(--text-2)}
.lock select{border:1px solid var(--line); border-radius:10px; padding:6px 10px; background:var(--bg); color:var(--text)}
.spin{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; height:100%; min-height:520px; color:var(--text-2)}
.spin .ico{font-size:72px; animation:bob .22s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0) rotate(-6deg)} to{transform:translateY(-8px) rotate(6deg)}}
.card{margin:6px 16px 0; border-radius:20px; border:1px solid var(--line); background:var(--bg); box-shadow:var(--shadow); padding:18px; display:flex; flex-direction:column; gap:14px}
.card .cline{display:flex; align-items:center; gap:8px; font-size:14px; color:var(--text-2); flex-wrap:wrap}
.card h2{font-size:28px; font-weight:800; margin:0; line-height:1.25; letter-spacing:-.02em; text-wrap:balance}
.why{display:flex; flex-direction:column; gap:8px; padding:12px 14px; border-radius:14px; background:var(--primary-soft)}
.why b{font-size:13px}
.why ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px}
.why li{display:flex; gap:8px; font-size:14.5px; line-height:1.45}
.why li span:first-child{flex:none}
.score{font-size:12px; color:var(--text-2); font-variant-numeric:tabular-nums}
.alts-h{margin:20px 16px 8px; font-size:14px; font-weight:700}
.alts{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 16px}
.alt{border:1px solid var(--line); background:var(--surface); border-radius:16px; padding:12px; text-align:left; display:flex; flex-direction:column; gap:4px}
.alt .n{font-weight:700; font-size:15px; line-height:1.3}
.alt .s{font-size:12.5px; color:var(--text-2)}
.alt .y{font-size:12.5px}
.notice{margin:8px 16px 0; padding:10px 12px; border-radius:12px; background:var(--surface-2); font-size:13px}
.again{display:flex; justify-content:center; padding:16px 16px 24px}
.again .btn{width:auto; padding:0 22px}

/* 달력 */
.cal-head{display:flex; align-items:center; gap:4px; padding:6px 8px 6px 6px}
.cal-head .t{font-size:19px; font-weight:800; flex:1; text-align:center; font-variant-numeric:tabular-nums}
.vt{display:flex; margin:0 16px 8px; background:var(--surface); border-radius:12px; padding:3px}
.vt button{flex:1; border:0; background:none; border-radius:10px; padding:7px 0; font-size:14px; font-weight:600; color:var(--text-2)}
.vt button[aria-pressed="true"]{background:var(--bg); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.12)}
.grid7{display:grid; grid-template-columns:repeat(7,1fr); padding:0 10px; gap:2px}
.wd{text-align:center; font-size:12px; color:var(--text-2); padding:6px 0; font-weight:600}
.wd.su, .day.su .num{color:var(--c)}
.wd.sa, .day.sa .num{color:var(--j)}
.day{border:0; background:none; height:54px; border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding-top:6px; gap:4px}
.day .num{font-size:15px; font-weight:500; width:28px; height:28px; display:grid; place-items:center; border-radius:999px; font-variant-numeric:tabular-nums}
.day.today .num{background:var(--text); color:var(--bg)!important; font-weight:700}
.day.sel{background:var(--surface)}
.dots{display:flex; gap:3px; height:7px}
.dots i{width:7px; height:7px; border-radius:999px; background:var(--cc)}
.sum{margin:12px 16px 0; padding:14px; border-radius:16px; background:var(--surface); display:flex; flex-direction:column; gap:10px}
.sum h3{margin:0; font-size:15px}
.bar{display:flex; height:12px; border-radius:999px; overflow:hidden; background:var(--surface-2); gap:2px}
.bar i{display:block; background:var(--cc)}
.legend{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:13px; font-variant-numeric:tabular-nums}
.legend span{display:flex; align-items:center; gap:5px}
.legend i{width:9px; height:9px; border-radius:3px; background:var(--cc)}
.add-fab{position:sticky; bottom:14px; margin:14px 16px 0 auto; width:56px; height:56px; border-radius:18px; border:0; background:var(--primary-strong); color:var(--on-primary); font-size:28px; font-weight:400; display:grid; place-items:center; box-shadow:var(--shadow); z-index:4}
.search{margin:0 16px 8px; display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:12px; padding:0 12px; background:var(--surface)}
.search input{flex:1; border:0; background:none; padding:11px 0; outline:none; min-width:0}
.lrow{display:flex; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); align-items:flex-start; width:100%; border-left:0; border-right:0; border-top:0; background:none; text-align:left}
.lrow .d{font-size:12.5px; color:var(--text-2); width:64px; flex:none; padding-top:3px; font-variant-numeric:tabular-nums}

/* 시트·토스트 */
.overlay{position:absolute; inset:0; z-index:30; display:flex; align-items:flex-end; background:rgba(0,0,0,.38)}
.overlay[hidden]{display:none}
.sheet{width:100%; background:var(--bg); border-radius:22px 22px 0 0; max-height:72%; overflow:auto; padding:8px 16px 20px}
.grab{width:40px; height:5px; border-radius:999px; background:var(--line); margin:4px auto 10px}
.sheet h3{margin:0; font-size:18px}
.sheet .wx{font-size:13px; color:var(--text-2)}
.entry{padding:14px 0; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:4px}
.entry .nm{display:flex; align-items:center; gap:8px; font-weight:700; font-size:16px}
.entry .nm button{border:0; background:none; padding:0; font-weight:700; font-size:16px; text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--line)}
.entry .acts{display:flex; justify-content:flex-end; gap:6px}
.entry .acts button{border:1px solid var(--line); background:var(--bg); border-radius:10px; padding:6px 12px; font-size:13px}
.photo{width:64px; height:64px; border-radius:12px; background:repeating-linear-gradient(45deg, var(--surface-2) 0 8px, var(--surface) 8px 16px); display:grid; place-items:center; font-size:11px; color:var(--text-2)}

/* ───────── 추천 엔진 (PLAN.md 9장) ───────── */
function weatherWhy(key, r) {
  const t = WEATHER[key].temp;
  if (key === 'rain') return { icon: '☔', text: `비가 오고 ${t}℃라 따뜻한 ${josa(r.sub, '이', '가')} 좋아요`, short: '따뜻한 국물' };
  if (key === 'cold') return { icon: '🥶', text: `${t}℃로 추워서 뜨끈한 ${josa(r.sub, '을', '를')} 추천해요`, short: '추운 날 국물' };
  if (key === 'hot') return { icon: '🥵', text: `${t}℃ 더운 날이라 시원한 ${r.sub} 어때요?`, short: '시원한 메뉴' };
  return null;
}
function scoreOf(r, ctx) {
  const s = state.settings, key = state.weather, w = WEATHER[key];
  const reasons = []; let total = 0;
  const add = (pts, why) => { total += pts; if (why) reasons.push({ pts, ...why }); };
  const lv = lastVisit(r.id);
  // 1. 식당 다양성 (0~30)
  if (lv === null) add(30, { icon: '🆕', text: '아직 가 보지 않은 식당이에요', short: '처음 가는 곳' });
  else if (lv <= 14) add(10);
  else add(20, { icon: '🔁', text: `마지막 방문이 ${lv}일 전이라 다시 가기 좋아요`, short: '오랜만' });
  // 2. 분류 다양성 (0~20)
  const lastN = ctx.recent.slice(0, s.streak).map(l => l.c);
  const last2 = ctx.recent.slice(0, 2).map(l => l.c);
  const same2 = last2.filter(c => c === r.c).length;
  const cn = CUI[r.c].name;
  if (lastN.length === s.streak && lastN.every(c => c === r.c)) add(0);
  else if (same2 === 0 && last2.length === 2) {
    const a = CUI[last2[1]].name, b = CUI[last2[0]].name;
    const text = a === b ? `최근 2번 연속 ${josa(a, '을', '를')} 먹어서 오늘은 ${josa(cn, '으로', '로')} 바꿨어요`
                         : `최근 2번은 ${a}·${b}, 오늘은 ${josa(cn, '으로', '로')} 바꿨어요`;
    add(20, { icon: '🔄', text, short: `${cn}으로 변화` });
  } else add(20 - 10 * same2);
  // 3. 메뉴 다양성 (0~10)
  if (r.tags.some(t => ctx.recentTags.has(t)) || ctx.recentTags.has(r.sub)) add(0); else add(10);
  // 4. 날씨 적합도 (0~25)
  if (key === 'rain' || key === 'cold' || key === 'hot') {
    if (r.tags.some(t => w.tags.includes(t))) add(25, weatherWhy(key, r)); else add(8);
  } else if (key === 'clear') {
    if (lv === null && r.dist >= 400) add(25, { icon: '🌤', text: `${w.temp}℃ 맑은 날이라 조금 걸어도 좋은 새 식당이에요`, short: '걷기 좋은 날' });
    else add(12);
  } else if (key === 'dust') {
    if (r.dist <= 400) add(25, { icon: '😷', text: '미세먼지가 나빠서 가까운 곳으로 골랐어요', short: '가까운 곳' }); else add(5);
  }
  // 5. 거리 (0~10, 비 오면 2배)
  const dp = Math.max(0, 10 * (1 - r.dist / s.radius)) * (key === 'rain' ? 2 : 1);
  add(dp);
  // 6. 만족도 (0~5)
  if (lv !== null && lv > 14) {
    const best = Math.max(...visitsOf(r.id).map(v => v.rating || 0));
    if (best >= 4) add(5, { icon: '⭐', text: `지난번에 별점 ${best}점을 준 곳이에요`, short: `별점 ${best}점` });
  }
  const top = reasons.sort((a, b) => b.pts - a.pts).slice(0, 3);
  top.push({ icon: '📍', text: `걸어서 ${walk(r.dist)}분 거리예요${key === 'rain' ? ' (비 오는 날이라 가까운 곳에 점수를 더 줬어요)' : ''}`, short: `${walk(r.dist)}분` });
  return { r, score: Math.round(total), reasons: top };
}
function recommend() {
  const s = state.settings, rec = state.rec;
  const base = RESTS.filter(r => r.dist <= s.radius && !state.excluded.has(r.id)
    && (s.includeEtc || r.c !== 'E') && !r.tags.some(t => state.dislikes.has(t))
    && !rec.skipped.has(r.id) && (rec.lock === 'all' || r.c === rec.lock));
  let avoid = s.avoidDays, relaxed = false;
  const pass = r => { const lv = lastVisit(r.id); return lv === null || lv > avoid; };
  let cands = base.filter(pass);
  if (cands.length < 5 && avoid > 3) { relaxed = true; avoid = 3; cands = base.filter(pass); }
  if (!cands.length) return { picks: [], relaxed, count: 0 };
  const recent = sortedLogs();
  const recentTags = new Set();
  recent.filter(l => daysAgo(l.date) <= 2).forEach(l => { const r = l.rid && rest(l.rid); if (r) r.tags.concat(r.sub).forEach(t => recentTags.add(t)); if (l.menu) recentTags.add(l.menu); });
  const scored = cands.map(r => scoreOf(r, { recent, recentTags })).sort((a, b) => b.score - a.score).slice(0, 10);
  const pool = [...scored], picks = [];
  while (picks.length < 3 && pool.length) {
    const tot = pool.reduce((a, x) => a + x.score ** 2, 0);
    let t = Math.random() * tot, i = 0;
    for (; i < pool.length - 1; i++) { t -= pool[i].score ** 2; if (t <= 0) break; }
    picks.push(pool.splice(i, 1)[0]);
  }
  picks.sort((a, b) => b.score - a.score);
  return { picks, relaxed, count: cands.length };
}

function skeleton() {

  else if (state.sort === 'new') list.sort((a, b) => ((lastVisit(a.id) === null) ? 0 : 1) - ((lastVisit(b.id) === null) ? 0 : 1) || a.dist - b.dist);
  else list.sort((a, b) => a.name.localeCompare(b.name, 'ko'));
  return list;
}

          <button class="plain" data-act="toast" data-v="주소를 복사했어요">🏠 서울 성동구 ${esc(r.road)}</button>
          <button class="plain" data-act="toast" data-v="전화 앱이 열려요 · ${r.phone}">📞 ${r.phone}</button>
        </div>
        <div class="two"><button class="btn btn-ghost btn-sm" data-act="naver" data-id="${r.id}" data-v="place">🗺 네이버 지도</button><button class="btn btn-ghost btn-sm" data-act="naver" data-id="${r.id}" data-v="route">🧭 길찾기</button></div>
        <button class="link" style="align-self:flex-start;padding:0" data-act="toast" data-v="카카오 장소 페이지(메뉴판·리뷰)가 열려요">카카오 장소 정보 보기 ›</button>

      <div class="bottom-bar"><button class="btn btn-primary" data-act="log-here" data-id="${r.id}">✏️ 오늘 여기서 먹었어요</button></div>`;

  recommend() {
    const rec = state.rec;
    const lockSel = `<label class="lock" for="lockSel">분류 고정 <select id="lockSel" data-in="rec-lock">
        <option value="all"${rec.lock === 'all' ? ' selected' : ''}>상관없음</option>
        ${['K', 'C', 'J', 'W'].map(k => `<option value="${k}"${rec.lock === k ? ' selected' : ''}>${CUI[k].icon} ${CUI[k].name}만</option>`).join('')}</select></label>`;
    if (rec.phase === 'spin') return `${topBar('오늘의 추천')}<div class="spin" aria-live="polite"><div class="ico" id="spinIco" aria-hidden="true">🍚</div><div>날씨와 기록을 보고 고르는 중…</div></div>`;
    if (rec.phase === 'start' || !rec.result) {
      const recent = sortedLogs().filter(l => l.meal === '저녁').slice(0, 3);
      return `${topBar('오늘의 추천')}
        <div class="rec-ctx">
          <div><span class="k">지금</span><br>${weatherLine()} · 📍 ${esc(state.location)}</div>
          <div><span class="k">최근 저녁</span><br>${recent.map(l => `${relDay(l.date)} ${CUI[l.c].icon} ${esc(l.menu || l.name)}`).join(' · ')}</div>
        </div>
        <div class="rec-hero">
          <div class="spark" aria-hidden="true">✨</div>
          <button class="go-btn" data-act="rec-start">오늘 뭐 먹지? 추천 받기</button>
          <p>최근 ${state.settings.avoidDays}일 안에 간 식당은 빼고, 날씨에 맞는 곳을 골라요</p>
          ${lockSel}
        </div>`;
    }
    const res = rec.result;
    if (!res.picks.length) return `${topBar('오늘의 추천')}<div class="empty"><div class="big" aria-hidden="true">🤔</div><p>조건에 맞는 식당이 더 없어요</p><span>넘긴 식당이나 분류 고정, 못 먹는 음식 설정을 확인해 주세요</span><button class="btn btn-ghost btn-sm" style="width:auto" data-act="rec-reset">처음부터 다시 추천</button></div>`;
    const big = res.picks[Math.min(rec.big, res.picks.length - 1)];
    const others = res.picks.filter(p => p !== big);
    const r = big.r;
    return `${topBar('오늘의 추천', { right: `<button class="ib" data-act="rec-again" aria-label="다른 추천 받기">${IC.refresh}</button>` })}
      ${res.relaxed ? `<div class="notice">최근 간 곳을 빼니 후보가 너무 적어서, 3일 전 기록까지만 피했어요</div>` : ''}
      <article class="card" aria-label="추천 식당">
        <div class="cline">${ciBox(r.c, 'sm')}<span>${CUI[r.c].name} · ${esc(r.sub)} · ${fmtDist(r.dist)}</span></div>
        <h2>${esc(r.name)}</h2>
        <div class="why"><b>왜 추천하나요?</b><ul>${big.reasons.map(x => `<li><span aria-hidden="true">${x.icon}</span><span>${esc(x.text)}</span></li>`).join('')}</ul></div>
        <div class="score">추천 점수 ${big.score} · 후보 ${res.count}곳 중에서 골랐어요</div>
        <div class="two"><button class="btn btn-ghost btn-sm" data-act="open-detail" data-id="${r.id}">상세 보기</button><button class="btn btn-primary btn-sm" data-act="rec-decide">✔ 여기로 결정</button></div>
      </article>
      ${others.length ? `<div class="alts-h">다른 후보</div><div class="alts">${others.map(p => `<button class="alt" data-act="rec-pick" data-i="${res.picks.indexOf(p)}" aria-label="${esc(p.r.name)}을 크게 보기">
          <span class="n">${CUI[p.r.c].icon} ${esc(p.r.name)}</span><span class="s">${fmtDist(p.r.dist)} · ${esc(p.r.sub)}</span><span class="y">${p.reasons[0].icon} ${esc(p.reasons[0].short)}</span></button>`).join('')}</div>` : ''}
      <div class="again"><button class="btn btn-ghost btn-sm" data-act="rec-again">↻ 다른 추천 받기</button></div>`;
  },

  calendar() {
    const c = state.cal;
    const head = `<div class="cal-head">
        <button class="ib" data-act="cal-step" data-v="-1" aria-label="이전 달">${IC.chevL}</button>
        <div class="t">${c.y}년 ${c.m + 1}월</div>
        <button class="ib" data-act="cal-step" data-v="1" aria-label="다음 달">${IC.chevR}</button>
        <button class="chip" data-act="cal-today" style="margin-left:4px">오늘</button></div>
      <div class="vt" role="group" aria-label="보기 방식"><button aria-pressed="${c.view === 'month'}" data-act="cal-view" data-v="month">달력</button><button aria-pressed="${c.view === 'list'}" data-act="cal-view" data-v="list">목록</button></div>`;
    if (c.view === 'list') {
      const q = c.q.trim();
      const list = sortedLogs().filter(l => !q || (l.name + ' ' + (l.menu || '')).includes(q));
      return `${topBar('달력')}${head}
        <div class="search"><span aria-hidden="true">🔍</span><input type="search" id="calq" value="${esc(c.q)}" placeholder="식당·메뉴 이름으로 찾기" aria-label="기록 검색" data-in="cal-q"></div>
        <div id="calList">${logListHtml(list)}</div>
        <button class="add-fab" data-act="log-add" aria-label="기록 추가">+</button>`;
    }
    const first = new Date(c.y, c.m, 1), days = new Date(c.y, c.m + 1, 0).getDate();
    const byDay = {}; state.logs.forEach(l => (byDay[l.date] = byDay[l.date] || []).push(l));
    let cells = WD.map((w, i) => `<div class="wd ${i === 0 ? 'su' : i === 6 ? 'sa' : ''}">${w}</div>`).join('');
    for (let i = 0; i < first.getDay(); i++) cells += '<div></div>';
    for (let d = 1; d <= days; d++) {
      const key = `${c.y}-${pad(c.m + 1)}-${pad(d)}`, dow = new Date(c.y, c.m, d).getDay();
      const ls = (byDay[key] || []).sort((a, b) => MEAL_RANK[a.meal] - MEAL_RANK[b.meal]);
      cells += `<button class="day ${dow === 0 ? 'su' : dow === 6 ? 'sa' : ''}${key === ymd(TODAY) ? ' today' : ''}${key === c.sel ? ' sel' : ''}" data-act="cal-day" data-v="${key}" aria-label="${c.m + 1}월 ${d}일${ls.length ? `, 기록 ${ls.length}건` : ''}">
        <span class="num">${d}</span><span class="dots">${ls.slice(0, 3).map(l => `<i style="${cuiStyle(l.c)}"></i>`).join('')}</span></button>`;
    }
    const monthLogs = state.logs.filter(l => l.date.startsWith(`${c.y}-${pad(c.m + 1)}`));
    const cnt = { K: 0, C: 0, J: 0, W: 0, E: 0 }; monthLogs.forEach(l => cnt[l.c]++);
    const total = monthLogs.length;
    const firstTimes = monthLogs.filter(l => l.rid && !state.logs.some(o => o.rid === l.rid && o.date < l.date)).length;
    const order = Object.keys(cnt).filter(k => cnt[k]).sort((a, b) => cnt[b] - cnt[a]);
    const sum = total ? `<div class="sum"><h3>${c.m + 1}월 요약</h3>
        <div class="bar" role="img" aria-label="분류 비율">${order.map(k => `<i style="${cuiStyle(k)};width:${(cnt[k] / total * 100).toFixed(1)}%"></i>`).join('')}</div>
        <div class="legend">${order.map(k => `<span><i style="${cuiStyle(k)}"></i>${CUI[k].name} ${Math.round(cnt[k] / total * 100)}%</span>`).join('')}</div>
        <div style="font-size:14px">이번 달 <b>${total}번</b> 기록 · 처음 간 곳 <b>${firstTimes}곳</b></div></div>`
      : `<div class="sum"><h3>${c.m + 1}월 요약</h3><div class="muted" style="font-size:14px">이 달에는 기록이 없어요</div></div>`;
    return `${topBar('달력')}${head}<div class="grid7">${cells}</div>${sum}
      <button class="add-fab" data-act="log-add" aria-label="${dayLabel(c.sel)} 기록 추가">+</button>`;
  },

        <div class="f" style="border-bottom:0"><span class="lb">날씨</span><div style="padding-top:9px">${esc(f.weather)} <span class="muted" style="font-size:12.5px">(자동)</span></div></div>

        ${link('못 먹는 음식', 'dislikes', state.dislikes.size ? state.dislikes.size + '개' : '')}

      <div class="chips wrap" role="group" aria-label="못 먹는 음식">${DISLIKE_TAGS.map(t => `<button class="chip" aria-pressed="${state.dislikes.has(t)}" data-act="dislike" data-v="${t}" style="--cc:var(--error)">${t}</button>`).join('')}</div>`;

        <div class="muted" style="font-size:14px">마지막 백업: 2026-10-10 (30일 전) · 기록 ${state.logs.length}건</div>
        <button class="btn btn-primary" data-act="toast" data-v="공유 시트가 열려요 · 드라이브, 카톡 나에게 보내기 등으로 저장">📤 백업 파일 만들기</button>

function logListHtml(list) {
  if (!list.length) return `<div class="empty"><p>찾는 기록이 없어요</p></div>`;
  return list.map(l => `<button class="lrow" data-act="cal-open" data-v="${l.date}"><span class="d">${dayLabel(l.date)}<br>${l.meal}</span>${ciBox(l.c, 'sm')}<span style="flex:1;min-width:0"><b>${esc(l.name)}</b><br><span class="muted" style="font-size:13px">${esc(l.menu || '')}</span></span><span class="stars" aria-label="별점 ${l.rating}점">${stars(l.rating || 0)}</span></button>`).join('');
}
function suggHtml(q) {
  q = (q || '').trim(); if (!q) return '';
  return RESTS.filter(r => r.name.includes(q)).slice(0, 5).map(r => `<button data-act="f-rest" data-id="${r.id}">${ciBox(r.c, 'sm')}${esc(r.name)}<small>${fmtDist(r.dist)}</small></button>`).join('');
}
function newForm(pref) {
  const f = { id: null, date: ymd(TODAY), meal: '저녁', rid: null, name: '', c: null, menu: '', rating: 0, memo: '', weather: weatherText(), fromRec: false, home: false, ...pref };
  if (f.rid) { const r = rest(f.rid); f.name = r.name; f.c = r.c; }

/* ───────── 오버레이 (달력 시트) ───────── */
const $phone = document.getElementById('phone'), $screen = document.getElementById('screen'), $tabs = document.getElementById('tabs');
const $overlay = document.getElementById('overlay'), $toast = document.getElementById('toast');
function renderOverlay() {
  if (state.route !== 'calendar' || !state.sheet) { $overlay.hidden = true; $overlay.innerHTML = ''; return; }
  const date = state.sheet;
  const ls = state.logs.filter(l => l.date === date).sort((a, b) => MEAL_RANK[b.meal] - MEAL_RANK[a.meal]);
  const wx = ls[0] && ls[0].weather;
  $overlay.hidden = false;
  $overlay.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${dayLabel(date)} 기록">
    <div class="grab" aria-hidden="true"></div>
    <div style="display:flex;align-items:center;gap:8px"><h3 style="flex:1">${parseYmd(date).getMonth() + 1}월 ${parseYmd(date).getDate()}일 (${WD[parseYmd(date).getDay()]})</h3>${wx ? `<span class="wx">${esc(wx)}</span>` : ''}<button class="ib" data-act="sheet-close" aria-label="닫기">${IC.close}</button></div>
    ${ls.length ? ls.map(l => `<div class="entry">
        <div class="nm">${ciBox(l.c, 'sm')}<span class="muted" style="font-weight:500;font-size:14px">${l.meal}</span>${l.rid ? `<button data-act="open-detail" data-id="${l.rid}">${esc(l.name)}</button>` : `<span>${esc(l.name)}</span>`}</div>
        <div>${esc(l.menu || '')} <span class="stars" aria-label="별점 ${l.rating}점">${stars(l.rating || 0)}</span>${l.fromRec ? ' <span class="badge">✨ 추천</span>' : ''}</div>
        ${l.memo ? `<div class="muted" style="font-size:14px">"${esc(l.memo)}"</div>` : ''}
        ${l.id % 3 === 2 ? '<div class="photo">사진</div>' : ''}
        <div class="acts"><button data-act="log-edit" data-id="${l.id}">수정</button><button data-act="log-del" data-id="${l.id}">삭제</button></div>
      </div>`).join('') : '<p class="muted" style="font-size:14px;padding:12px 0">이 날은 기록이 없어요</p>'}
    <div style="padding-top:14px"><button class="btn btn-ghost btn-sm" data-act="log-add">+ 이 날 기록 추가</button></div>
  </div>`;
}

/* ───────── 토스트 ───────── */
let toastTimer = null, toastUndo = null;
function toast(msg, undo) {
  clearTimeout(toastTimer); toastUndo = undo || null;
  $toast.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button data-act="toast-undo">되돌리기</button>' : ''}`;
  $toast.hidden = false;
  toastTimer = setTimeout(() => { $toast.hidden = true; toastUndo = null; }, 3800);
}

/* ───────── 탭·패널 ───────── */
function renderTabs() {
  const cur = TAB_OF[state.route];
  $tabs.hidden = !cur;
  if (!cur) return;
  const t = (k, label, icon, hot) => `<button class="tab${hot ? ' hot' : ''}" data-act="go" data-v="${k}"${cur === k ? ' aria-current="page"' : ''}>${icon}<span>${label}</span></button>`;
  $tabs.innerHTML = t('nearby', '주변', IC.pin) + t('recommend', '추천', IC.spark, true) + t('calendar', '달력', IC.cal) + t('prefs', '설정', IC.gear);
}
const $scrList = document.getElementById('scrList'), $note = document.getElementById('note');
const $wxSeg = document.getElementById('wxSeg'), $modeSeg = document.getElementById('modeSeg');
function renderPanel() {
  $scrList.innerHTML = SCREENS.map(([k, id, name]) => `<button class="scr" data-panel="go" data-v="${k}"${state.route === k ? ' aria-current="page"' : ''}><span class="id">${id}</span>${name}</button>`).join('');
  const s = SCREENS.find(x => x[0] === state.route);
  $note.innerHTML = `<b><span style="font-family:var(--font-mono);font-size:12px;color:var(--accent)">${s[1]}</span> ${s[2]}</b>${s[3]}`;
  $wxSeg.innerHTML = Object.entries(WEATHER).map(([k, w]) => `<button aria-pressed="${state.weather === k}" data-panel="wx" data-v="${k}">${w.icon} ${w.label}</button>`).join('');
  $modeSeg.innerHTML = [['system', '시스템 따름'], ['light', '라이트'], ['dark', '다크']].map(([k, l]) => `<button aria-pressed="${state.mode === k}" data-panel="mode" data-v="${k}">${l}</button>`).join('');
}

/* ───────── 이동 ───────── */
function render() {
  const r = state.route;
  $screen.className = 'screen' + (r === 'map' ? ' full' : '');
  $phone.dataset.mode = state.mode;
  $screen.innerHTML = VIEWS[r]();
  renderTabs(); renderOverlay(); renderPanel();
}
function go(route, from) {
  if (!ROUTES.includes(route)) route = 'nearby';
  if (from) state.returnTo[route] = from;
  if (route === 'log' && !state.form) state.form = newForm({});
  state.route = route; state.sheet = null;
  if (route === 'nearby' && !state.loadedOnce) { state.loadedOnce = true; load(); }
  render(); $screen.scrollTop = 0;
  try { if (location.hash.slice(1) !== route) location.hash = route; } catch (e) { /* 일부 보기 화면에서는 주소를 바꿀 수 없음 */ }
}
function back() {
  const to = state.returnTo[state.route] || PARENT[state.route] || 'nearby';
  if (state.route === 'log') state.form = null;
  go(to);
}
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (ROUTES.includes(h) && h !== state.route) go(h); });

function load() {
  state.loading = true; render();
  setTimeout(() => { state.loading = false; if (state.route === 'nearby') render(); }, reduceMotion() ? 0 : 650);
}
function openDetail(id) { const from = state.route; state.detailId = id; go('detail', from); }
function hideRest(id) {
  const r = rest(id); state.excluded.add(id);
  if (state.route === 'detail') go(state.returnTo.detail || 'nearby'); else render();
  toast(`${r.name}을(를) 숨겼어요`, () => { state.excluded.delete(id); render(); });
}
function runRec() {
  const finish = () => { state.rec.result = recommend(); state.rec.big = 0; state.rec.phase = 'result'; if (state.route === 'recommend') { render(); $screen.scrollTop = 0; } };
  if (!state.settings.anim || reduceMotion()) return finish();
  state.rec.phase = 'spin'; render();
  const icons = ['🍚', '🥟', '🍣', '🍝']; let i = 0;
  const t = setInterval(() => { const e = document.getElementById('spinIco'); if (e) e.textContent = icons[++i % 4]; }, 110);
  setTimeout(() => { clearInterval(t); finish(); }, 850);
}
function saveLog() {
  const f = state.form;
  if (!f.date || !f.name.trim() || !f.c) { state.formErr = '날짜, 식당, 분류는 꼭 입력해 주세요'; render(); return; }
  const rec = { id: f.id ?? state.nextId++, date: f.date, meal: f.meal, rid: f.rid, name: f.name.trim(), c: f.c, menu: f.menu.trim(), rating: f.rating, memo: f.memo.trim(), weather: f.weather, fromRec: f.fromRec };
  const idx = state.logs.findIndex(l => l.id === rec.id);
  if (idx >= 0) state.logs[idx] = rec; else state.logs.push(rec);
  const d = parseYmd(f.date), edited = idx >= 0;
  if (f.fromRec) state.rec = freshRec(state.rec.lock);
  state.form = null; state.formErr = '';
  state.cal = { ...state.cal, y: d.getFullYear(), m: d.getMonth(), sel: f.date, view: 'month' };
  go('calendar'); state.sheet = f.date; renderOverlay();
  toast(edited ? '기록을 고쳤어요' : '기록했어요. 달력에 점이 생겼어요');
}

/* ───────── 이벤트 ───────── */
const ACT = {
  go: el => go(el.dataset.v, ['detail', 'log'].includes(el.dataset.v) ? state.route : null),
  back: () => back(),
  filter: el => { state.filter = el.dataset.v; render(); },
  'open-detail': el => openDetail(+el.dataset.id),
  hide: el => hideRest(+el.dataset.id),
  refresh: () => load(),
  widen: () => { state.settings.radius = 2000; render(); toast('검색 반경을 2km로 넓혔어요'); },
  'map-sel': el => { state.mapSel = +el.dataset.id; render(); },
  'map-step': el => {
    const list = inRadius().filter(r => state.filter === 'all' || r.c === state.filter).sort((a, b) => a.dist - b.dist);
    const i = list.findIndex(r => r.id === state.mapSel);
    state.mapSel = list[(i + +el.dataset.v + list.length) % list.length].id; render();
  },
  naver: el => { const r = rest(+el.dataset.id); toast(el.dataset.v === 'route' ? `네이버 지도 앱에서 ${r.name}까지 길찾기를 열어요` : `네이버 지도 앱에서 ${r.name}을(를) 열어요`); },
  toast: el => toast(el.dataset.v),
  'log-here': el => { state.form = newForm({ rid: +el.dataset.id }); go('log', 'detail'); },
  'rec-start': () => runRec(),
  'rec-again': () => { (state.rec.result?.picks || []).forEach(p => state.rec.skipped.add(p.r.id)); runRec(); },
  'rec-pick': el => { state.rec.big = +el.dataset.i; render(); $screen.scrollTop = 0; },
  'rec-reset': () => { state.rec = freshRec(state.rec.lock); render(); },
  'rec-decide': () => {
    const p = state.rec.result.picks[state.rec.big];
    state.form = newForm({ rid: p.r.id, menu: p.r.sub, fromRec: true });
    go('log', 'recommend');
  },
  'cal-step': el => { const d = new Date(state.cal.y, state.cal.m + +el.dataset.v, 1); state.cal.y = d.getFullYear(); state.cal.m = d.getMonth(); render(); },
  'cal-today': () => { state.cal = { ...state.cal, y: TODAY.getFullYear(), m: TODAY.getMonth(), sel: ymd(TODAY) }; render(); },
  'cal-view': el => { state.cal.view = el.dataset.v; render(); },
  'cal-day': el => { state.cal.sel = el.dataset.v; state.sheet = el.dataset.v; render(); },
  'cal-open': el => { const d = parseYmd(el.dataset.v); state.cal = { ...state.cal, sel: el.dataset.v, y: d.getFullYear(), m: d.getMonth() }; state.sheet = el.dataset.v; renderOverlay(); },
  'sheet-close': () => { state.sheet = null; renderOverlay(); },
  'log-add': () => { state.form = newForm({ date: state.sheet || state.cal.sel }); go('log', 'calendar'); },
  'log-edit': el => { const l = state.logs.find(x => x.id === +el.dataset.id); state.form = newForm({ ...l, home: !l.rid }); if (l.rid) { state.form.menu = l.menu; } go('log', 'calendar'); },
  'log-del': el => {
    const id = +el.dataset.id, i = state.logs.findIndex(x => x.id === id), l = state.logs[i];
    state.logs.splice(i, 1); render();
    toast('기록을 지웠어요', () => { state.logs.splice(i, 0, l); render(); });
  },
  'f-rest': el => { const r = rest(+el.dataset.id); Object.assign(state.form, { rid: r.id, name: r.name, c: r.c, home: false }); render(); },
  'f-clear': () => { Object.assign(state.form, { rid: null, name: '', home: false }); render(); const i = document.getElementById('f-name'); if (i) i.focus(); },
  'f-home': () => { Object.assign(state.form, { rid: null, name: '집밥·배달', home: true }); render(); },
  'f-cui': el => { state.form.c = el.dataset.v; render(); },
  'f-menu': el => { state.form.menu = el.dataset.v; render(); },
  'f-star': el => { const n = +el.dataset.v; state.form.rating = state.form.rating === n ? 0 : n; render(); },
  'f-meal': el => { state.form.meal = el.dataset.v; render(); },
  'f-save': () => saveLog(),
  mode: el => { state.mode = el.dataset.v; render(); },
  restore: el => { state.excluded.delete(+el.dataset.id); render(); toast('목록에 다시 보여요'); },
  dislike: el => { const t = el.dataset.v; state.dislikes.has(t) ? state.dislikes.delete(t) : state.dislikes.add(t); state.rec = freshRec(state.rec.lock); render(); },
  'loc-set': el => {
    const v = el.dataset.v.trim(); state.location = v; go('nearby');
    toast(v === '성수동2가' ? `위치를 ${josa(v, '으로', '로')} 설정했어요` : `위치를 ${josa(v, '으로', '로')} 바꿨어요 (시안이라 식당 목록은 같아요)`);
  },
  'onb-allow': () => { go('nearby'); toast('시스템 위치 권한 창이 떠요 (시안에서는 허용한 것으로 처리)'); },
  'onb-later': () => go('location', 'onboarding'),
  'toast-undo': () => { const u = toastUndo; $toast.hidden = true; toastUndo = null; if (u) u(); },
};

let drag = null, suppressClick = false;
$phone.addEventListener('click', e => {
  if (suppressClick) { e.preventDefault(); return; }
  if (e.target === $overlay) { state.sheet = null; renderOverlay(); return; }
  const el = e.target.closest('[data-act]');
  if (!el || !$phone.contains(el)) return;
  const sw = el.closest('.swipe');
  if (sw && sw.classList.contains('open') && el.dataset.act === 'open-detail') { sw.classList.remove('open'); return; }
  const fn = ACT[el.dataset.act]; if (fn) fn(el);
});
$phone.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Escape' && state.sheet) { state.sheet = null; renderOverlay(); }
});
$phone.addEventListener('change', e => {
  const k = e.target.dataset.in; if (!k) return; const v = e.target.value;
  if (k === 'sort') { state.sort = v; render(); }
  else if (k === 'hideRecent') { state.hideRecent = e.target.checked; render(); }
  else if (k === 'rec-lock') { state.rec.lock = v; }
  else if (k === 'f-date') { state.form.date = v; }
  else if (['radius', 'avoidDays', 'streak'].includes(k)) { state.settings[k] = +v; state.rec = freshRec(state.rec.lock); render(); toast('설정을 바꿨어요. 주변 목록과 추천에 바로 반영돼요'); }
  else if (k === 'includeEtc' || k === 'anim') { state.settings[k] = e.target.checked; state.rec = freshRec(state.rec.lock); }
});
$phone.addEventListener('input', e => {
  const k = e.target.dataset.in; if (!k) return; const v = e.target.value;
  if (k === 'f-name') { state.form.name = v; state.form.rid = null; const s = document.getElementById('f-sugg'); if (s) s.innerHTML = suggHtml(v); }
  else if (k === 'f-menu') state.form.menu = v;
  else if (k === 'f-memo') state.form.memo = v;
  else if (k === 'cal-q') { state.cal.q = v; const box = document.getElementById('calList'); const q = v.trim(); if (box) box.innerHTML = logListHtml(sortedLogs().filter(l => !q || (l.name + ' ' + (l.menu || '')).includes(q))); }
});
$phone.addEventListener('pointerdown', e => {
  const row = e.target.closest('.swipe'); if (!row || e.target.closest('.swipe-act')) return;
  drag = { row, x: e.clientX, y: e.clientY, dx: 0, moved: false, base: row.classList.contains('open') ? -88 : 0 };
});
window.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) drag.moved = true;
  if (drag.moved) { const x = Math.max(-88, Math.min(0, drag.base + dx)); drag.dx = x; const b = drag.row.querySelector('.swipe-body'); b.style.transition = 'none'; b.style.transform = `translateX(${x}px)`; }
});
window.addEventListener('pointerup', () => {
  if (!drag) return; const d = drag; drag = null;
  if (!d.moved) return;
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 60);
  document.querySelectorAll('.swipe.open').forEach(o => { if (o !== d.row) o.classList.remove('open'); });
  d.row.classList.toggle('open', d.dx < -44);
  const b = d.row.querySelector('.swipe-body'); b.style.transition = ''; b.style.transform = '';
  const act = d.row.querySelector('.swipe-act'); act.tabIndex = d.dx < -44 ? 0 : -1;
});

document.querySelector('.panel').addEventListener('click', e => {
  const el = e.target.closest('[data-panel]'); if (!el) return;
  const k = el.dataset.panel, v = el.dataset.v;
  if (k === 'go') { if (v === 'log') state.form = newForm({}); go(v, ['detail', 'log'].includes(v) ? state.route : null); }
  else if (k === 'wx') {
    state.weather = v; if (state.form) state.form.weather = weatherText();
    if (state.rec.phase === 'result') { state.rec.skipped.clear(); state.rec.result = recommend(); state.rec.big = 0; }
    render(); toast(`날씨를 '${WEATHER[v].label}'(으)로 바꿨어요`);
  }
  else if (k === 'mode') { state.mode = v; render(); }
});
document.getElementById('resetBtn').addEventListener('click', () => { initState(); state.loadedOnce = true; go('nearby'); toast('예시 데이터를 처음 상태로 돌렸어요'); });

/* 시작 */
const start = location.hash.slice(1);
go(ROUTES.includes(start) ? start : 'nearby');
</script>
</body>
</html>

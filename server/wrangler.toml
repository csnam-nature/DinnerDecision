# Cloudflare Workers 설정 (PLAN.md 6장). 비밀값은 여기에 넣지 않는다.
#   npx wrangler secret put KAKAO_REST_KEY
#   npx wrangler secret put RATE_LIMIT_SALT
name = "dinner-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
# off → monitor → enforce 순서로 올린다 (PLAN.md 6단계).
# monitor: 토큰이 없거나 틀려도 통과시키고 로그만 남긴다 (`npx wrangler tail`에서 appCheck 줄 확인).
# enforce: Play 내부 테스트로 설치한 앱에서 모두 ok가 나온 뒤에 올린다.
APP_CHECK_MODE = "monitor"
# Firebase 콘솔 › 프로젝트 설정 › 일반 › 프로젝트 번호 (비밀값 아님)
FIREBASE_PROJECT_NUMBER = "958664376605"
FIREBASE_APP_IDS = ""
KAKAO_CALL_BUDGET = "40"
RATE_LIMIT_PER_MINUTE = "30"

# npx wrangler d1 create dinner-cache 로 만든 뒤 나오는 database_id 를 넣는다.
[[d1_databases]]
binding = "DB"
database_name = "dinner-cache"
database_id = "d121dadb-02b7-4e08-8337-a4ea921ad724"
migrations_dir = "migrations"

# 하루 한 번 지난 캐시 지우기 (UTC 19:00 = 한국 04:00)
[triggers]
crons = ["0 19 * * *"]

[observability]
enabled = true
